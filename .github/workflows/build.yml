name: Build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarkdown-labs/setup-quarkdown@v1
        with:
          quarkdown-version: '1.13.0'

      - name: Build
        run: quarkdown c src/main.qd --out-name site --clean

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: dist
          publish_dir: ./quarkdown-output/site
