name: Build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarkdown-labs/setup-quarkdown@v1
        with:
          quarkdown-version: 'devbuild'

      - name: Check Quarkdown block indentation
        run: bash scripts/check-qd-indent.sh

      - name: Build
        run: |
          set -o pipefail
          quarkdown c src/main.qd --out-name site --clean --strict 2>&1 | tee build.log
          mkdir -p quarkdown-output/site/network-guide
          for f in src/network-guide/*.qd; do
            if [[ "$(basename "$f")" != "setup.qd" ]]; then
              name=$(basename "$f" .qd)
              quarkdown c "$f" --pipe --allow global-read | sed \
                -e 's|src="\./script/|src="/script/|g' \
                -e 's|href="\./theme/|href="/theme/|g' \
                -e 's|href="\./lib/|href="/lib/|g' \
                > "quarkdown-output/site/network-guide/${name}.html"
            fi
          done

      - name: Verify build output
        run: |
          test -f quarkdown-output/site/index.html
          ! grep -rq 'class="box error"' quarkdown-output/site/
          ! grep -rq '<h4>Error:' quarkdown-output/site/
          ! grep -qi 'cannot call function' build.log
          ! grep -qiE 'error:|expected [0-9]+ arguments' build.log
          grep -q '<script>document.addEventListener' quarkdown-output/site/index.html
          ! grep -q '</div>document.addEventListener' quarkdown-output/site/index.html

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: dist
          publish_dir: ./quarkdown-output/site
          cname: oldsea.me
