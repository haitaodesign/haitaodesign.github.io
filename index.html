<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brett | Old Hai</title>
    <style>
        :root {
            --background: 240 10% 3.9%;
            --foreground: 0 0% 98%;
            --card: 240 10% 3.9%;
            --card-foreground: 0 0% 98%;
            --popover: 240 10% 3.9%;
            --popover-foreground: 0 0% 98%;
            --primary: 0 0% 98%;
            --primary-foreground: 240 5.9% 10%;
            --secondary: 240 3.7% 15.9%;
            --secondary-foreground: 0 0% 98%;
            --muted: 240 3.7% 15.9%;
            --muted-foreground: 240 5% 64.9%;
            --accent: 240 3.7% 15.9%;
            --accent-foreground: 0 0% 98%;
            --destructive: 0 62.8% 30.6%;
            --destructive-foreground: 0 0% 98%;
            --border: 240 3.7% 15.9%;
            --input: 240 3.7% 15.9%;
            --ring: 240 4.9% 83.9%;
            --radius: 0.5rem;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: hsl(var(--background));
            color: hsl(var(--foreground));
            font-family: "Geist Sans", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        header {
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            margin-bottom: 0.5rem;
        }

        .slogan {
            font-size: 1rem;
            color: hsl(var(--muted-foreground));
            font-weight: 400;
        }

        .links {
            display: grid;
            gap: 0.75rem;
        }

        a {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1rem;
            border-radius: var(--radius);
            border: 1px solid hsl(var(--border));
            background-color: transparent;
            color: hsl(var(--foreground));
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        a:hover {
            background-color: hsl(var(--secondary));
            border-color: hsl(var(--ring) / 0.3);
            transform: scale(1.01);
        }

        footer {
            margin-top: 4rem;
            font-size: 0.75rem;
            color: hsl(var(--muted-foreground));
            opacity: 0.6;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>Brett</h1>
            <p class="slogan">Frontend Engineer, learning Full-stack, interested in AI</p>
        </header>

        <nav class="links">
            <a href="https://github.com/haitaodesign" target="_blank">GitHub · 代码与底座</a>
        </nav>

        <footer>
            Built with ❤️ by Brett @2026
        </footer>
    </div>
</body>

</html>
