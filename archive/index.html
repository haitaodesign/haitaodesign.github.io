<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brett | Personal Space</title>
    
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-zinc-950: #09090b;
            --bg-zinc-900: #121214;
            --bg-zinc-900-trans: rgba(18, 18, 20, 0.65);
            --border-zinc-800: rgba(39, 39, 42, 0.8);
            --border-zinc-700: rgba(63, 63, 70, 0.9);
            --text-zinc-50: #fafafa;
            --text-zinc-300: #d4d4d8;
            --text-zinc-400: #a1a1aa;
            --text-zinc-500: #71717a;
            --accent-purple: #a855f7;
            --accent-indigo: #6366f1;
            --radius: 12px;
            --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-zinc-950);
            color: var(--text-zinc-50);
            font-family: var(--font-sans);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1.5rem;
            position: relative;
            overflow: hidden;
        }

        /* Glowing Decorative Orbs */
        .glow-orb-1 {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 45vw;
            height: 45vw;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.08) 0%, rgba(99, 102, 241, 0) 70%);
            z-index: -1;
            filter: blur(40px);
            pointer-events: none;
            animation: float-1 20s infinite ease-in-out alternate;
        }

        .glow-orb-2 {
            position: absolute;
            bottom: -10%;
            right: -10%;
            width: 45vw;
            height: 45vw;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.08) 0%, rgba(168, 85, 247, 0) 70%);
            z-index: -1;
            filter: blur(40px);
            pointer-events: none;
            animation: float-2 15s infinite ease-in-out alternate-reverse;
        }

        @keyframes float-1 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(5%, 8%) scale(1.1); }
        }

        @keyframes float-2 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-5%, -8%) scale(1.05); }
        }

        /* Portal Container */
        .portal-container {
            width: 100%;
            max-width: 450px;
            background: var(--bg-zinc-900-trans);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-zinc-800);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8),
                        0 0 80px -20px rgba(99, 102, 241, 0.05);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .portal-container::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 20%;
            right: 20%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.35), rgba(168, 85, 247, 0.35), transparent);
            z-index: 11;
        }

        /* Avatar */
        .avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            margin: 0 auto 1.25rem;
            background: linear-gradient(135deg, var(--accent-indigo), var(--accent-purple));
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
            position: relative;
        }

        .avatar::after {
            content: '';
            position: absolute;
            inset: 2px;
            background: var(--bg-zinc-950);
            border-radius: 50%;
            z-index: 1;
        }

        .avatar-txt {
            font-size: 1.35rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 30%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            z-index: 2;
        }

        /* Header Info */
        h1 {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, var(--text-zinc-50), var(--text-zinc-300));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 0.92rem;
            font-weight: 500;
            color: var(--text-zinc-400);
            margin-bottom: 2.25rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        .subtitle span.divider {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background-color: var(--text-zinc-500);
        }

        /* Link Cards Grid */
        .links-group {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            margin-bottom: 2rem;
        }

        .link-card {
            display: flex;
            flex-direction: column;
            text-align: left;
            text-decoration: none;
            padding: 1.15rem;
            background: rgba(24, 24, 27, 0.45);
            border: 1px solid var(--border-zinc-800);
            border-radius: var(--radius);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .link-card:hover {
            background: rgba(24, 24, 27, 0.85);
            border-color: var(--border-zinc-700);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -15px rgba(0, 0, 0, 0.5);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.35rem;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-zinc-50);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .badge {
            font-size: 0.65rem;
            font-family: var(--font-mono);
            font-weight: 500;
            padding: 0.1rem 0.4rem;
            border-radius: 99px;
            border: 1px solid rgba(168, 85, 247, 0.2);
            background-color: rgba(168, 85, 247, 0.08);
            color: rgba(216, 180, 254, 0.9);
        }

        .card-desc {
            font-size: 0.82rem;
            color: var(--text-zinc-400);
            line-height: 1.45;
        }

        .card-arrow {
            opacity: 0;
            transform: translateX(-4px);
            transition: all 0.25s ease;
            color: var(--text-zinc-400);
            font-size: 0.85rem;
        }

        .link-card:hover .card-arrow {
            opacity: 1;
            transform: translateX(0);
            color: var(--text-zinc-50);
        }

        /* Footer */
        footer {
            font-size: 0.7rem;
            color: var(--text-zinc-500);
            font-family: var(--font-mono);
            opacity: 0.8;
            margin-top: 1rem;
        }
    </style>
</head>

<body>
    <!-- Decorative Glowing Spots -->
    <div class="glow-orb-1"></div>
    <div class="glow-orb-2"></div>

    <div class="portal-container">
        <header>
            <div class="avatar">
                <span class="avatar-txt">B</span>
            </div>
            <h1>Brett (Old Sea)</h1>
            <div class="subtitle">
                <span>技术降维探索者</span>
                <span class="divider"></span>
                <span>商业实验记录员</span>
            </div>
        </header>

        <main class="links-group">
            <!-- Quarkdown -->
            <a href="https://github.com/iamgio/quarkdown" target="_blank" class="link-card">
                <div class="card-header">
                    <span class="card-title">
                        Quarkdown
                        <span class="badge">Featured</span>
                    </span>
                    <span class="card-arrow">→</span>
                </div>
                <p class="card-desc">
                    轻量灵活的 Markdown 渲染引擎。设计优美、扩展性强，是构建下一代极简博客原型的关键底层组件。
                </p>
            </a>

            <!-- GitHub Profile -->
            <a href="https://github.com/haitaodesign" target="_blank" class="link-card">
                <div class="card-header">
                    <span class="card-title">GitHub Profile</span>
                    <span class="card-arrow">→</span>
                </div>
                <p class="card-desc">
                    我的开源主阵地。沉淀各种前端探索、全栈商业化底座以及自动化效率工具的物理存放区。
                </p>
            </a>
        </main>

        <footer>
            © 2026 Brett • Built with Precision
        </footer>
    </div>
</body>

</html>
